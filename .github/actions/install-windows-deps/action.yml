name: Install Windows Dependencies
description: Install dependencies for building RFL on Windows via vcpkg

inputs:
  install-armadillo:
    description: 'Install Armadillo via vcpkg'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set vcpkg root environment variable
      shell: pwsh
      run: |
        $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
        if (-not $vcpkgRoot -or -not (Test-Path $vcpkgRoot)) {
          $vcpkgRoot = $env:VCPKG_ROOT
        }
        if (-not $vcpkgRoot -or -not (Test-Path $vcpkgRoot)) {
          $vcpkgRoot = "C:\vcpkg"
        }
        Write-Host "Using vcpkg root at: $vcpkgRoot"
        "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Cache vcpkg installed artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.VCPKG_INSTALLATION_ROOT || 'C:/vcpkg' }}/installed
          ${{ env.VCPKG_INSTALLATION_ROOT || 'C:/vcpkg' }}/packages
        key: vcpkg-${{ runner.os }}-x64-${{ inputs.install-armadillo }}-${{ hashFiles('.github/actions/install-windows-deps/action.yml') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-x64-${{ inputs.install-armadillo }}-
          vcpkg-${{ runner.os }}-x64-

    - name: Install dependencies via vcpkg
      shell: pwsh
      run: |
        $packages = @("gsl:x64-windows", "openblas:x64-windows")
        if ("${{ inputs.install-armadillo }}" -eq "true") {
          $packages += "armadillo:x64-windows"
        }
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install @packages
        $binPath = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin"
        if (Test-Path $binPath) {
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
