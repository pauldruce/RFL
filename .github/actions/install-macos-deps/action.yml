name: Install macOS Dependencies
description: Install system dependencies for building RFL on macOS via Homebrew

inputs:
  install-armadillo:
    description: 'Install Armadillo via Homebrew'
    required: false
    default: 'false'
  install-gsl:
    description: 'Install GSL via Homebrew for legacy support'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Install macOS dependencies
      shell: bash
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        export HOMEBREW_NO_INSTALL_UPGRADE=1
        export HOMEBREW_NO_BUILD_FROM_SOURCE=1
        PACKAGES=(
          cmake
          ninja
          doxygen
          graphviz
          pkg-config
        )
        if [[ "${{ inputs.install-armadillo }}" == "true" ]]; then
          PACKAGES+=(armadillo)
        fi
        if [[ "${{ inputs.install-gsl }}" == "true" ]]; then
          PACKAGES+=(gsl)
        fi
        brew install --overwrite "${PACKAGES[@]}" || true
