# ==============================================================================
# GitHub Native Release Notes Configuration
# Documentation: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
# ==============================================================================
changelog:
  categories:
    - title: "🚀 Features & Enhancements"
      labels:
        - "enhancement"
        - "feature"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "🧰 Build & CI/CD Architecture"
      labels:
        - "ci"
        - "build"
        - "dependencies"
    - title: "📚 Documentation & Governance"
      labels:
        - "documentation"
        - "docs"
  exclude:
    labels:
      - "chore"
