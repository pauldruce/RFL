name: Compatability Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat_linux:
    name: "Linux (${{matrix.os}}, ${{matrix.build_type}}, Armadillo ${{matrix.arma_version}})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        build_type: [Release]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{matrix.os}}-${{matrix.arma_version}}-${{matrix.build_type}}

      - name: Configure CMake
        run: |
          cmake -B build -S src/RFL -G Ninja \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRFL_FETCH_ARMADILLO=ON \
            -DARMADILLO_GIT_TAG=${{matrix.arma_version}}

      - name: Build
        run: cmake --build build --config ${{matrix.build_type}}

      - name: Test
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure

  compat_macos:
    name: "macOS (${{matrix.os}}, ${{matrix.build_type}}, Armadillo ${{matrix.arma_version}})"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, macos-14]
        build_type: [Release]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-macos-deps

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{matrix.os}}-${{matrix.arma_version}}-${{matrix.build_type}}

      - name: Configure CMake
        run: |
          HOMEBREW_PREFIX="$(brew --prefix 2>/dev/null || echo '/opt/homebrew')"
          cmake -B build -S src/RFL -G Ninja \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRFL_FETCH_ARMADILLO=ON \
            -DARMADILLO_GIT_TAG=${{matrix.arma_version}}

      - name: Build
        run: cmake --build build --config ${{matrix.build_type}}

      - name: Test
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure
