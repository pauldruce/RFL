name: Build And Test

on:
  workflow_dispatch:
  push:
    branches:
      - "*"

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        BUILD_TYPE: [ Release ]
        OS: [ ubuntu-latest, macos-latest, macos-15-intel ]
        ARMA_VERSION: [ 12.6.6 ]


    # The CMake configure and build commands are platform-agnostic and should
    # work equally well on Windows or Mac. You can convert this to a matrix
    # build if you need cross-platform coverage. See:
    # https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix

    name: "${{matrix.BUILD_TYPE}}, ${{matrix.OS}}, Armadillo v${{matrix.ARMA_VERSION}}."
    runs-on: ${{matrix.OS}}
    # Allow automatic runs, but restrict manual runs to repository owner; skip doc-only commits
    if: (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner) && !contains(github.event.head_commit.message, '#docs')

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.OS,'ubuntu')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake                 \
            libopenblas-dev       \
            liblapack-dev         \
            libarpack2-dev        \
            libsuperlu-dev        \
            wget                  \
            libgsl-dev            \
            doxygen               \
            graphviz              \
            libhdf5-serial-dev

      - name: Install macOS dependencies
        if: startsWith(matrix.OS,'macos')
        run: |
          brew update
          brew install \
            cmake \
            doxygen \
            graphviz \
            wget \
            arpack \
            hdf5 \
            libaec \
            openblas \
            superlu \
            pkg-config \
            gsl || true

      - name: Download Armadillo from SourceForge
        run: |
          mkdir armadillo
          cd armadillo
          wget -O armadillo.tar.xz https://sourceforge.net/projects/arma/files/armadillo-${{matrix.ARMA_VERSION}}.tar.xz/download

      - name: Unzip Armadillo tarball and create build directory
        working-directory: armadillo
        run: |
          tar -xf ./armadillo.tar.xz
          cd armadillo-${{matrix.ARMA_VERSION}}
          mkdir build
          cd build

      - name: Configure CMake for Armadillo macOS
        if: startsWith(matrix.OS,'macos')
        working-directory: armadillo/armadillo-${{matrix.ARMA_VERSION}}/build
        run: |
          OPENBLAS_PREFIX="$(brew --prefix openblas 2>/dev/null || echo '/usr/local/opt/openblas')"
          HOMEBREW_PREFIX="$(brew --prefix 2>/dev/null || echo '/usr/local')"
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DALLOW_OPENBLAS_MACOS=ON -DCMAKE_PREFIX_PATH="${OPENBLAS_PREFIX};${HOMEBREW_PREFIX}" -DOpenBLAS_HOME="${OPENBLAS_PREFIX}" ..

      - name: Configure CMake for Armadillo Linux
        working-directory: armadillo/armadillo-${{matrix.ARMA_VERSION}}/build
        if: startsWith(matrix.OS,'ubuntu')
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..

      - name: Build and Install Armadillo
        working-directory: armadillo/armadillo-${{matrix.ARMA_VERSION}}/build
        run: |
          cmake --build . --target all -j 2
          sudo cmake --install .

      - name: Configure CMake
        working-directory: ${{github.workspace}}/src/RFL
        run: |
          if [[ "${{matrix.OS}}" == macos* ]]; then
            HOMEBREW_PREFIX="$(brew --prefix 2>/dev/null || echo '/usr/local')"
            cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.BUILD_TYPE}} -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}"
          else
            cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.BUILD_TYPE}}
          fi

      - name: Build the entire project
        working-directory: ${{github.workspace}}/src/RFL
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.BUILD_TYPE}} --target all -j 2

      - name: Run CTest
        working-directory: ${{github.workspace}}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest -j2 -C ${{matrix.BUILD_TYPE}} --output-on-failure
