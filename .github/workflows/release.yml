name: Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "src/RFL/pyproject.toml"
      - "src/RFL/python_bindings/**"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish packages to PyPI"
        type: boolean
        default: false
      publish_to_testpypi:
        description: "Publish packages to TestPyPI"
        type: boolean
        default: true
      dry_run:
        description: "Dry run (build and test without publishing)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheel on ${{ matrix.os }} (${{ matrix.cibw_arch }})
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_arch: x86_64
            deployment_target: ""
          - os: macos-15-intel
            cibw_arch: x86_64
            deployment_target: "15.0"
          - os: macos-14
            cibw_arch: arm64
            deployment_target: "14.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: src/RFL
        env:
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.cibw_arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution (sdist)
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist src/RFL --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish_testpypi:
    name: TestPyPI Publication
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi && !inputs.dry_run) && github.actor == github.repository_owner
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Display release distribution assets
        run: ls -la dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish_release:
    name: GitHub Release & PyPI Publication
    if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi && !inputs.dry_run)) && github.actor == github.repository_owner
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Display release distribution assets
        run: ls -la dist/

      - name: Upload Release Assets to GitHub Release
        if: (github.event_name == 'release') || (startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name || github.ref_name }}" dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
