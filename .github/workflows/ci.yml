name: CI Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, labeled, unlabeled, synchronize, reopened, milestoned, demilestoned ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: CI Execution Planner
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      validate_docs: ${{ steps.plan.outputs.validate_docs }}
      lint_cpp: ${{ steps.plan.outputs.lint_cpp }}
      test_ubuntu: ${{ steps.plan.outputs.test_ubuntu }}
      test_macos: ${{ steps.plan.outputs.test_macos }}
      test_windows: ${{ steps.plan.outputs.test_windows }}
      ctest_filter: ${{ steps.plan.outputs.ctest_filter }}
      required_checks: ${{ steps.plan.outputs.required_checks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Compute CI execution plan
        id: plan
        run: mise run ci:plan -- --output plan.json

      - name: Upload execution plan
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-plan
          path: plan.json
          retention-days: 7

  check_milestone:
    name: Milestone Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Verify PR has assigned milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run ci:milestone

  validate_docs:
    name: Documentation, Links, Spelling & Traceability
    needs: plan
    if: needs.plan.outputs.validate_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Validate documentation, links, spelling & traceability
        run: mise run ci:docs

      - name: Verify PR traceability (docs / script-only PRs)
        if: github.event_name == 'pull_request' && needs.plan.outputs.test_ubuntu != 'true'
        run: mise run ci:verify:pr

  lint:
    name: C++ Linter
    needs: plan
    if: needs.plan.outputs.lint_cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Mise
        uses: jdx/mise-action@v2

      - name: Run C++ Style Linter
        run: mise run lint:cpp

  test_ubuntu:
    name: Ubuntu PR Smoke Test
    needs: plan
    if: needs.plan.outputs.test_ubuntu == 'true'
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ubuntu-latest
      install_system_armadillo: true
      test_python: true
      verify_pr: true
      ctest_filter: ${{ needs.plan.outputs.ctest_filter }}

  test_macos:
    name: macOS PR Smoke Test
    needs: plan
    if: needs.plan.outputs.test_macos == 'true'
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: macos-latest
      install_system_armadillo: true
      ctest_filter: ${{ needs.plan.outputs.ctest_filter }}

  test_windows:
    name: Windows PR Smoke Test
    needs: plan
    if: needs.plan.outputs.test_windows == 'true'
    uses: ./.github/workflows/_build_and_test_windows.yml
    with:
      os: windows-latest
      install_system_armadillo: true
      ctest_filter: ${{ needs.plan.outputs.ctest_filter }}

  matrix_linux:
    name: "Matrix Linux"
    needs: plan
    if: needs.plan.outputs.test_ubuntu == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  matrix_macos:
    name: "Matrix macOS"
    needs: plan
    if: needs.plan.outputs.test_macos == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, macos-14]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  matrix_windows:
    name: "Matrix Windows"
    needs: plan
    if: needs.plan.outputs.test_windows == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_windows.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  ci-gate:
    name: CI Gatekeeper
    needs: [plan, check_milestone, validate_docs, lint, test_ubuntu, test_macos, test_windows, matrix_linux, matrix_macos, matrix_windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Evaluate required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: mise run ci:gate
