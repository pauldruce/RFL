name: CI Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, labeled, unlabeled, synchronize, reopened, milestoned, demilestoned ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: CI Execution Planner
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      validate_docs: ${{ steps.plan.outputs.validate_docs }}
      lint_cpp: ${{ steps.plan.outputs.lint_cpp }}
      test_ubuntu: ${{ steps.plan.outputs.test_ubuntu }}
      test_macos: ${{ steps.plan.outputs.test_macos }}
      test_windows: ${{ steps.plan.outputs.test_windows }}
      ctest_filter: ${{ steps.plan.outputs.ctest_filter }}
      required_checks: ${{ steps.plan.outputs.required_checks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute CI execution plan
        id: plan
        run: python3 scripts/ci_plan.py plan --output plan.json

      - name: Upload execution plan
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-plan
          path: plan.json
          retention-days: 7

  check_milestone:
    name: Milestone Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR has assigned milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MILESTONE="${{ github.event.pull_request.milestone.title }}"
          if [ -z "$MILESTONE" ]; then
            MILESTONE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json milestone --jq '.milestone.title // empty' 2>/dev/null || true)
          fi
          if [ -z "$MILESTONE" ]; then
            echo "::error::Pull Request #${{ github.event.pull_request.number }} does not have an assigned milestone. All PRs targeting main must belong to an active milestone."
            exit 1
          fi
          echo "✅ Pull request is assigned to milestone: $MILESTONE"

  validate_docs:
    name: Documentation, Links, Spelling & Traceability
    needs: plan
    if: needs.plan.outputs.validate_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate links and badges
        run: python3 scripts/check_links.py

      - name: Spell & British English Check (CSpell)
        run: npx cspell lint --dot .

      - name: Audit requirement IDs and traceability engine
        run: |
          python3 scripts/verify_traceability.py --audit
          python3 -m unittest discover -s scripts/tests

      - name: Verify PR traceability (docs / script-only PRs)
        if: github.event_name == 'pull_request' && needs.plan.outputs.test_ubuntu != 'true'
        run: python3 scripts/verify_traceability.py --check-pr

  lint:
    name: "C++ Linter (${{ matrix.path }})"
    needs: plan
    if: needs.plan.outputs.lint_cpp == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [src, examples, playground]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run clang-format style check for ${{ matrix.path }}
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "16"
          check-path: ${{ matrix.path }}

  test_ubuntu:
    name: Ubuntu PR Smoke Test
    needs: plan
    if: needs.plan.outputs.test_ubuntu == 'true'
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ubuntu-latest
      install_system_armadillo: true
      ctest_filter: ${{ needs.plan.outputs.ctest_filter }}

  test_macos:
    name: macOS PR Smoke Test
    needs: plan
    if: needs.plan.outputs.test_macos == 'true'
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: macos-latest
      install_system_armadillo: true
      ctest_filter: ${{ needs.plan.outputs.ctest_filter }}

  test_windows:
    name: Windows PR Smoke Test
    needs: plan
    if: needs.plan.outputs.test_windows == 'true'
    uses: ./.github/workflows/_build_and_test_windows.yml
    with:
      os: windows-latest
      install_system_armadillo: true
      ctest_filter: ${{ needs.plan.outputs.ctest_filter }}

  matrix_linux:
    name: "Matrix Linux"
    needs: plan
    if: needs.plan.outputs.test_ubuntu == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  matrix_macos:
    name: "Matrix macOS"
    needs: plan
    if: needs.plan.outputs.test_macos == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, macos-14]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  matrix_windows:
    name: "Matrix Windows"
    needs: plan
    if: needs.plan.outputs.test_windows == 'true' && contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_windows.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  ci-gate:
    name: CI Gatekeeper
    needs: [plan, check_milestone, validate_docs, lint, test_ubuntu, test_macos, test_windows, matrix_linux, matrix_macos, matrix_windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["plan"]["result"] != "success":
              sys.exit("❌ CI Execution Planner failed or was cancelled.")
          if needs["check_milestone"]["result"] in ("failure", "cancelled"):
              sys.exit("❌ Milestone verification failed: pull request must have an assigned milestone.")
          required = json.loads(needs["plan"]["outputs"].get("required_checks", "[]"))
          failed = [j for j in required if needs[j]["result"] != "success"]
          failed += [j for j in ("matrix_linux", "matrix_macos", "matrix_windows") if needs[j]["result"] in ("failure", "cancelled")]
          if failed:
              sys.exit(f"❌ Failed or cancelled required checks: {failed}")
          print(f"✅ All required checks passed: {required}")
          '
