name: CI Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Path Filtering
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.agents/**'
              - 'research/**'
              - 'vault/**'
              - '.gitignore'
            code:
              - 'src/**'
              - 'playground/**'
              - 'CMakeLists.txt'
              - 'BUILD.plz'
              - '.plzconfig'
              - 'third_party/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/linter.yml'

  test_ubuntu:
    name: Ubuntu PR Smoke Test
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake                 \
            libopenblas-dev       \
            liblapack-dev         \
            libarpack2-dev        \
            libsuperlu-dev        \
            libgsl-dev            \
            libhdf5-dev           \
            libhdf5-serial-dev    \
            libarmadillo-dev
          sudo ln -s /usr/lib/x86_64-linux-gnu/hdf5/serial/libhdf5.so /usr/lib/x86_64-linux-gnu/libhdf5.so 2>/dev/null || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ubuntu-pr

      - name: Restore Please Cache
        uses: actions/cache@v4
        with:
          path: .plz-cache
          key: plz-cache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp', 'BUILD*', '.plzconfig') }}
          restore-keys: |
            plz-cache-${{ runner.os }}-

      - name: Run changed tests with Please
        run: |
          ALL_TARGETS=$(./pleasew query changes --since origin/${{ github.base_ref || 'main' }} --level -1)
          if [ -n "$ALL_TARGETS" ]; then
            TEST_TARGETS=$(echo "$ALL_TARGETS" | xargs ./pleasew query filter --include=test 2>/dev/null || true)
            if [ -n "$TEST_TARGETS" ]; then
              echo "Executing changed test targets: $TEST_TARGETS"
              ./pleasew test -p --test_results_file=plz-out/log/test_results.xml $TEST_TARGETS
            else
              echo "No test targets affected by this change. Building changed targets..."
              ./pleasew build -p $ALL_TARGETS
            fi
          else
            echo "No code targets affected by this change."
          fi

  test_macos:
    name: macOS PR Smoke Test
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install macOS dependencies
        run: |
          brew install cmake armadillo gsl openblas hdf5 superlu arpack

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-macos-pr

      - name: Configure CMake
        run: |
          HOMEBREW_PREFIX="$(brew --prefix 2>/dev/null || echo '/opt/homebrew')"
          cmake -B build -S src/RFL -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}"

      - name: Build C++ library and tests
        run: cmake --build build --config Release -j 2

      - name: Run CTest
        run: ctest --test-dir build -j 2 -C Release --output-on-failure

  ci-gate:
    name: CI Gatekeeper
    needs: [filter, test_ubuntu, test_macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Gatekeeper Results
        run: |
          echo "Filter result: ${{ needs.filter.result }}"
          echo "Ubuntu test result: ${{ needs.test_ubuntu.result }}"
          echo "macOS test result: ${{ needs.test_macos.result }}"

          if [ "${{ needs.filter.result }}" = "failure" ] || [ "${{ needs.filter.result }}" = "cancelled" ]; then
            echo "❌ Path filtering job failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_ubuntu.result }}" = "failure" ] || [ "${{ needs.test_ubuntu.result }}" = "cancelled" ]; then
            echo "❌ Ubuntu PR smoke test failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_macos.result }}" = "failure" ] || [ "${{ needs.test_macos.result }}" = "cancelled" ]; then
            echo "❌ macOS PR smoke test failed or was cancelled."
            exit 1
          fi

          echo "✅ All required checks passed or were safely skipped."
          exit 0