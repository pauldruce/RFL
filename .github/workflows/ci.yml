name: CI Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, labeled, unlabeled, synchronize, reopened, milestoned, demilestoned ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Path Filtering
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

  check_milestone:
    name: Milestone Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR has assigned milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MILESTONE="${{ github.event.pull_request.milestone.title }}"
          if [ -z "$MILESTONE" ]; then
            # Query live GitHub API in case milestone was attached immediately after PR creation
            MILESTONE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json milestone --jq '.milestone.title // empty' 2>/dev/null || true)
          fi
          if [ -z "$MILESTONE" ]; then
            echo "::error::Pull Request #${{ github.event.pull_request.number }} does not have an assigned milestone. All PRs targeting main must belong to an active milestone."
            exit 1
          fi
          echo "✅ Pull request is assigned to milestone: $MILESTONE"

  validate_docs:
    name: Documentation & Link Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate links and badges
        run: python3 scripts/check_links.py

  lint:
    name: "C++ Linter (${{ matrix.path }})"
    needs: filter
    if: >-
      needs.filter.outputs.code == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - "src"
          - "examples"
          - "playground"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run clang-format style check for ${{ matrix.path }}
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "16"
          check-path: ${{ matrix.path }}

  test_ubuntu:
    name: Ubuntu PR Smoke Test
    needs: filter
    if: >-
      needs.filter.outputs.code == 'true' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ubuntu-latest
      install_system_armadillo: true

  test_macos:
    name: macOS PR Smoke Test
    needs: filter
    if: >-
      needs.filter.outputs.code == 'true' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: macos-latest
      install_system_armadillo: true

  test_windows:
    name: Windows PR Smoke Test
    needs: filter
    if: >-
      needs.filter.outputs.code == 'true' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build_and_test_windows.yml
    with:
      os: windows-latest
      install_system_armadillo: true

  matrix_linux:
    name: "Matrix Linux"
    needs: filter
    if: >-
      (
        needs.filter.outputs.code == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  matrix_macos:
    name: "Matrix macOS"
    needs: filter
    if: >-
      (
        needs.filter.outputs.code == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, macos-14]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  matrix_windows:
    name: "Matrix Windows"
    needs: filter
    if: >-
      (
        needs.filter.outputs.code == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      contains(github.event.pull_request.labels.*.name, 'ci:full-matrix')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        arma_version: ["11.4.x", "12.8.x", "14.2.x"]
    uses: ./.github/workflows/_build_and_test_windows.yml
    with:
      os: ${{ matrix.os }}
      arma_version: ${{ matrix.arma_version }}
      install_system_armadillo: false

  ci-gate:
    name: CI Gatekeeper
    needs: [filter, check_milestone, validate_docs, lint, test_ubuntu, test_macos, test_windows, matrix_linux, matrix_macos, matrix_windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "Filter result: ${{ needs.filter.result }}"
          echo "Milestone check result: ${{ needs.check_milestone.result }}"
          echo "Documentation & link check result: ${{ needs.validate_docs.result }}"
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Ubuntu smoke test result: ${{ needs.test_ubuntu.result }}"
          echo "macOS smoke test result: ${{ needs.test_macos.result }}"
          echo "Windows smoke test result: ${{ needs.test_windows.result }}"
          echo "Linux matrix result: ${{ needs.matrix_linux.result }}"
          echo "macOS matrix result: ${{ needs.matrix_macos.result }}"
          echo "Windows matrix result: ${{ needs.matrix_windows.result }}"

          if [ "${{ needs.filter.result }}" = "failure" ] || \
             [ "${{ needs.filter.result }}" = "cancelled" ]; then
            echo "❌ Path filtering job failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.check_milestone.result }}" = "failure" ] || \
             [ "${{ needs.check_milestone.result }}" = "cancelled" ]; then
            echo "❌ Milestone verification failed: pull request must have an assigned milestone."
            exit 1
          fi

          if [ "${{ needs.validate_docs.result }}" = "failure" ] || \
             [ "${{ needs.validate_docs.result }}" = "cancelled" ]; then
            echo "❌ Documentation and link integrity validation failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.lint.result }}" = "cancelled" ]; then
            echo "❌ C++ linting failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_ubuntu.result }}" = "failure" ] || \
             [ "${{ needs.test_ubuntu.result }}" = "cancelled" ]; then
            echo "❌ Ubuntu PR smoke test failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_macos.result }}" = "failure" ] || \
             [ "${{ needs.test_macos.result }}" = "cancelled" ]; then
            echo "❌ macOS PR smoke test failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_windows.result }}" = "failure" ] || \
             [ "${{ needs.test_windows.result }}" = "cancelled" ]; then
            echo "❌ Windows PR smoke test failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.matrix_linux.result }}" = "failure" ] || \
             [ "${{ needs.matrix_linux.result }}" = "cancelled" ]; then
            echo "❌ Linux compatibility matrix failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.matrix_macos.result }}" = "failure" ] || \
             [ "${{ needs.matrix_macos.result }}" = "cancelled" ]; then
            echo "❌ macOS compatibility matrix failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.matrix_windows.result }}" = "failure" ] || \
             [ "${{ needs.matrix_windows.result }}" = "cancelled" ]; then
            echo "❌ Windows compatibility matrix failed or was cancelled."
            exit 1
          fi

          echo "✅ All required checks passed or were safely skipped."
          exit 0
