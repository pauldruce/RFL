name: CI Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Path Filtering
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.agents/**'
              - 'research/**'
              - 'vault/**'
              - '.gitignore'
            code:
              - 'src/**'
              - 'playground/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - '.clang-format'
              - '.github/workflows/**'
              - '.github/actions/**'

  lint:
    name: "C++ Linter (${{ matrix.path }})"
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - "src/RFL"
          - "playground"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run clang-format style check for ${{ matrix.path }}
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "16"
          check-path: ${{ matrix.path }}

  test_ubuntu:
    name: Ubuntu PR Smoke Test
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build_and_test_linux.yml
    with:
      os: ubuntu-latest
      install_system_armadillo: true

  test_macos:
    name: macOS PR Smoke Test
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build_and_test_macos.yml
    with:
      os: macos-latest
      install_system_armadillo: true

  ci-gate:
    name: CI Gatekeeper
    needs: [filter, lint, test_ubuntu, test_macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "Filter result: ${{ needs.filter.result }}"
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Ubuntu test result: ${{ needs.test_ubuntu.result }}"
          echo "macOS test result: ${{ needs.test_macos.result }}"

          if [ "${{ needs.filter.result }}" = "failure" ] || [ "${{ needs.filter.result }}" = "cancelled" ]; then
            echo "❌ Path filtering job failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.lint.result }}" = "cancelled" ]; then
            echo "❌ C++ linting failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_ubuntu.result }}" = "failure" ] || [ "${{ needs.test_ubuntu.result }}" = "cancelled" ]; then
            echo "❌ Ubuntu PR smoke test failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.test_macos.result }}" = "failure" ] || [ "${{ needs.test_macos.result }}" = "cancelled" ]; then
            echo "❌ macOS PR smoke test failed or was cancelled."
            exit 1
          fi

          echo "✅ All required checks passed or were safely skipped."
          exit 0