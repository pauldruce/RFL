name: Build and Test Windows

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system runner (e.g. windows-latest, windows-2022)'
        type: string
        required: true
      build_type:
        description: 'CMake build type (Allowed: Release, Debug)'
        type: string
        required: false
        default: 'Release'
      arma_version:
        description: 'Armadillo Git tag/version branch (e.g. 11.4.x, 12.8.x, 14.2.x)'
        type: string
        required: false
        default: ''
      install_system_armadillo:
        description: 'Whether to install Armadillo from system package manager'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  run:
    name: "Windows (${{ inputs.os }}, ${{ inputs.build_type }})"
    runs-on: ${{ inputs.os }}
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $allowedBuildTypes = @("Release", "Debug")
          if (-not ($allowedBuildTypes -contains "${{ inputs.build_type }}")) {
            Write-Error "Invalid build_type '${{ inputs.build_type }}'. Must be one of: $($allowedBuildTypes -join ', ')"
            exit 1
          }

          if ("${{ inputs.install_system_armadillo }}" -eq "true" -and "${{ inputs.arma_version }}" -ne "") {
            Write-Error "Conflicting inputs: arma_version ('${{ inputs.arma_version }}') cannot be set when install_system_armadillo is true. Set install_system_armadillo to false to test a specific Armadillo version via FetchContent."
            exit 1
          }

          if ("${{ inputs.install_system_armadillo }}" -ne "true" -and "${{ inputs.arma_version }}" -eq "") {
            Write-Error "arma_version must be specified when install_system_armadillo is false."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        uses: ./.github/actions/install-windows-deps
        with:
          install-armadillo: ${{ inputs.install_system_armadillo }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ccache-${{ inputs.os }}-${{ inputs.build_type }}-${{ inputs.arma_version }}
          restore-keys: |
            ccache-${{ inputs.os }}-${{ inputs.build_type }}-
            ccache-${{ inputs.os }}-
          max-size: 500M

      - name: Configure CMake
        shell: pwsh
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_COMPRESS: "1"
        run: |
          $vcpkgToolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          $cmakeArgs = @(
            "-B", "build",
            "-S", "src/RFL",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}",
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          )
          if ("${{ inputs.install_system_armadillo }}" -ne "true") {
            $cmakeArgs += "-DRFL_FETCH_ARMADILLO=ON"
            $cmakeArgs += "-DARMADILLO_GIT_TAG=${{ inputs.arma_version }}"
          }
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ inputs.build_type }}

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C ${{ inputs.build_type }} --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure
