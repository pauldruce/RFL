# Single source of truth for path filtering in GitHub Actions CI workflows

docs:
  - 'docs/**'
  - '*.md'
  - '.agents/**'
  - 'research/**'
  - 'vault/**'
  - '.gitignore'

code:
  - 'src/**'
  - 'examples/**'
  - 'cmake/**'
  - 'playground/**'
  - 'CMakeLists.txt'
  - 'pyproject.toml'
  - 'scripts/**'
  - '.clang-format'
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/filters.yaml'
