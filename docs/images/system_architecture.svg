<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 11px; font-weight: 600; fill: #475569; }
      .item { font-size: 12px; font-weight: 500; fill: #334155; }
      .badge { font-size: 10px; font-weight: 600; fill: #ffffff; }
      .edge-text { font-size: 10px; font-weight: 500; fill: #475569; }
      .box { rx: 8px; ry: 8px; stroke-width: 1.5px; }
      .flow-line { stroke: #64748b; stroke-width: 1.5px; fill: none; }
      .dash-line { stroke: #94a3b8; stroke-width: 1.5px; stroke-dasharray: 4 3; fill: none; }
      
      @media (prefers-color-scheme: dark) {
        .title { fill: #f8fafc; }
        .subtitle { fill: #94a3b8; }
        .item { fill: #cbd5e1; }
        .edge-text { fill: #94a3b8; }
        .flow-line { stroke: #94a3b8; }
        .dash-line { stroke: #64748b; }
        .edge-bg { fill: #0f172a; }
      }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. TOP TIER: Research & Exploration Layer (Width: 840)            -->
  <!-- ================================================================= -->
  <g transform="translate(40, 25)">
    <rect class="box" x="0" y="0" width="840" height="90" fill="#f8faff" stroke="#3b82f6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="840" height="28" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="20" width="840" height="8" fill="#eff6ff"/>
    
    <text class="label title" x="16" y="19" fill="#1d4ed8">Research &amp; Exploration Layer</text>
    <rect x="225" y="6" width="60" height="16" rx="4" fill="#2563eb"/>
    <text class="label badge" x="235" y="18">Python</text>
    <rect x="292" y="6" width="70" height="16" rx="4" fill="#0284c7"/>
    <text class="label badge" x="302" y="18">pybind11</text>
    
    <!-- Left Card: Python Interface -->
    <rect x="16" y="38" width="390" height="42" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="label subtitle" x="28" y="54">Python Module (pyrfl)</text>
    <text class="label item" x="28" y="70">• Zero-copy NumPy arrays &amp; generator steppers</text>

    <!-- Right Card: Telemetry Pipeline -->
    <rect x="434" y="38" width="390" height="42" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text class="label subtitle" x="446" y="54">Telemetry &amp; Observable Sinks</text>
    <text class="label item" x="446" y="70">• ISimulationObserver, EigenvalueRecorder</text>
  </g>

  <!-- Connectors from Top Tier -->
  <!-- Down to Sampler: (x=245, y=115) to (x=245, y=175) -->
  <path class="flow-line" d="M 245 115 L 245 175" marker-end="url(#arrow)" stroke="#2563eb"/>
  <rect class="edge-bg" x="145" y="136" width="200" height="16" rx="4" fill="#ffffff"/>
  <text class="label edge-text" x="245" y="148" text-anchor="middle" fill="#2563eb">configures &amp; orchestrates</text>

  <!-- Down to Dirac: (x=675, y=115) to (x=675, y=175) -->
  <path class="flow-line" d="M 675 115 L 675 175" marker-end="url(#arrow)" stroke="#2563eb"/>
  <rect class="edge-bg" x="590" y="136" width="170" height="16" rx="4" fill="#ffffff"/>
  <text class="label edge-text" x="675" y="148" text-anchor="middle" fill="#2563eb">inspects spectral state</text>


  <!-- ================================================================= -->
  <!-- 2. MIDDLE TIER: Sampling Engine & Noncommutative Geometry Core    -->
  <!-- ================================================================= -->
  
  <!-- Left Box: Sampling & Optimisation Engine -->
  <g transform="translate(40, 180)">
    <rect class="box" x="0" y="0" width="390" height="135" fill="#f0fdfa" stroke="#0d9488" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="390" height="28" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="0" y="20" width="390" height="8" fill="#ccfbf1"/>
    
    <text class="label title" x="16" y="19" fill="#0f766e">Sampling &amp; Optimisation Engine</text>
    <rect x="250" y="6" width="55" height="16" rx="4" fill="#0d9488"/>
    <text class="label badge" x="259" y="18">Solvers</text>

    <!-- Inner components -->
    <rect x="14" y="38" width="362" height="40" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
    <text class="label subtitle" x="24" y="54">Markov Chain Monte Carlo (MCMC)</text>
    <text class="label item" x="24" y="70">• MetropolisStepper (local coordinate variations)</text>

    <rect x="14" y="84" width="362" height="40" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
    <text class="label subtitle" x="24" y="100">Step Calibration &amp; Dynamics</text>
    <text class="label item" x="24" y="116">• DualAveraging step tuner &amp; HMC integrators</text>
  </g>

  <!-- Horizontal connector: Sampler to Dirac -->
  <path class="flow-line" d="M 430 240 L 485 240" marker-end="url(#arrow-teal)" stroke="#0d9488" stroke-width="2"/>
  <rect class="edge-bg" x="432" y="222" width="55" height="14" rx="3" fill="#ffffff"/>
  <text class="label edge-text" x="460" y="233" text-anchor="middle" fill="#0f766e">updates</text>

  <!-- Right Box: Noncommutative Geometry Core -->
  <g transform="translate(490, 180)">
    <rect class="box" x="0" y="0" width="390" height="135" fill="#fffbeb" stroke="#d97706" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="390" height="28" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="20" width="390" height="8" fill="#fef3c7"/>
    
    <text class="label title" x="16" y="19" fill="#b45309">Noncommutative Geometry Core</text>
    <rect x="260" y="6" width="60" height="16" rx="4" fill="#d97706"/>
    <text class="label badge" x="268" y="18">Geometry</text>

    <!-- Inner components -->
    <rect x="14" y="38" width="362" height="40" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text class="label subtitle" x="24" y="54">DiracOperator (Value Type)</text>
    <text class="label item" x="24" y="70">• Herm / anti-Herm matrices (H, L), spectrum</text>

    <rect x="14" y="84" width="362" height="40" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text class="label subtitle" x="24" y="100">CliffordModule (p, q)</text>
    <text class="label item" x="24" y="116">• Gamma matrices &amp; rank-4 trace table Ω^(4)</text>
  </g>


  <!-- Connectors between Middle and Bottom Tier -->
  <!-- Sampler down to Action: (x=235, y=315) to (x=235, y=375) -->
  <path class="flow-line" d="M 235 315 L 235 375" marker-end="url(#arrow)" stroke="#64748b"/>
  <rect class="edge-bg" x="140" y="336" width="190" height="16" rx="4" fill="#ffffff"/>
  <text class="label edge-text" x="235" y="348" text-anchor="middle">queries energy variation ΔS</text>

  <!-- Dirac down to Linear Algebra: (x=685, y=315) to (x=685, y=375) -->
  <path class="flow-line" d="M 685 315 L 685 375" marker-end="url(#arrow)" stroke="#64748b"/>
  <rect class="edge-bg" x="615" y="336" width="140" height="16" rx="4" fill="#ffffff"/>
  <text class="label edge-text" x="685" y="348" text-anchor="middle">delegates matrix math</text>

  <!-- Cross-link: Action to Dirac (Traces) -->
  <path class="dash-line" d="M 430 425 C 470 425, 470 330, 510 320" marker-end="url(#arrow)" stroke="#8b5cf6"/>
  <rect class="edge-bg" x="440" y="365" width="80" height="14" rx="3" fill="#ffffff"/>
  <text class="label edge-text" x="480" y="375" text-anchor="middle" fill="#6d28d9">traces</text>


  <!-- ================================================================= -->
  <!-- 3. BOTTOM TIER: Action Functionals & Foundational Math            -->
  <!-- ================================================================= -->

  <!-- Left Box: Action & Energy Functionals -->
  <g transform="translate(40, 380)">
    <rect class="box" x="0" y="0" width="390" height="135" fill="#faf5ff" stroke="#8b5cf6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="390" height="28" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="20" width="390" height="8" fill="#f3e8ff"/>
    
    <text class="label title" x="16" y="19" fill="#6d28d9">Action &amp; Energy Functionals</text>
    <rect x="245" y="6" width="60" height="16" rx="4" fill="#8b5cf6"/>
    <text class="label badge" x="256" y="18">Physics</text>

    <!-- Inner components -->
    <rect x="14" y="38" width="362" height="40" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text class="label subtitle" x="24" y="54">BarrettGlaserAction</text>
    <text class="label item" x="24" y="70">• Energy evaluation: S(D) = g2·Tr(D²) + g4·Tr(D⁴)</text>

    <rect x="14" y="84" width="362" height="40" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text class="label subtitle" x="24" y="100">Analytic Variations (ΔS)</text>
    <text class="label item" x="24" y="116">• O(1) single-entry rank-4 commutator update</text>
  </g>

  <!-- Right Box: Foundational Math Engines -->
  <g transform="translate(490, 380)">
    <rect class="box" x="0" y="0" width="390" height="135" fill="#f8fafc" stroke="#64748b" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="390" height="28" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="20" width="390" height="8" fill="#f1f5f9"/>
    
    <text class="label title" x="16" y="19" fill="#334155">Foundational Math Engines</text>
    <rect x="240" y="6" width="65" height="16" rx="4" fill="#64748b"/>
    <text class="label badge" x="250" y="18">Compute</text>

    <!-- Inner components -->
    <rect x="14" y="38" width="362" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text class="label subtitle" x="24" y="54">Armadillo C++ Library</text>
    <text class="label item" x="24" y="70">• High-performance cx_mat, BLAS, and LAPACK</text>

    <rect x="14" y="84" width="362" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text class="label subtitle" x="24" y="100">Stochastic Engine (GslRng)</text>
    <text class="label item" x="24" y="116">• GSL uniform &amp; normal random variate generators</text>
  </g>
</svg>
